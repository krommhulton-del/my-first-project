<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>记忆画廊 · 副本 #047 — VR 预览</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital@0;1&family=Noto+Serif+SC:wght@200;300&display=swap" rel="stylesheet" />
<style>
  *{margin:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:#06040a;font-family:"Noto Serif SC",serif;cursor:default}
  #c{position:fixed;inset:0;display:block}
  .ui{position:fixed;z-index:5;color:#E8DFD3;text-shadow:0 2px 24px rgba(0,0,0,.9);pointer-events:none}
  #title{top:5%;left:0;right:0;text-align:center}
  #title h1{font-family:"Cormorant Garamond",serif;font-style:italic;font-weight:400;font-size:clamp(22px,4vw,40px);letter-spacing:.08em;color:#F5EBD8}
  #title .s{font-weight:200;letter-spacing:.34em;font-size:clamp(11px,1.6vw,15px);color:#B89664;margin-top:.3em}
  #cap{bottom:9%;left:0;right:0;text-align:center;font-weight:300;letter-spacing:.1em;font-size:clamp(15px,2.4vw,24px);opacity:0;transition:opacity 1.2s}
  #cap.show{opacity:1}
  #hint{bottom:3.5%;left:0;right:0;text-align:center;font-family:ui-monospace,monospace;font-size:11px;letter-spacing:.18em;color:rgba(232,223,211,.45)}
  #grain{position:fixed;inset:0;z-index:6;pointer-events:none;opacity:.05;mix-blend-mode:overlay}
  #vig{position:fixed;inset:0;z-index:4;pointer-events:none;
       background:radial-gradient(120% 80% at 50% 45%,transparent 45%,rgba(4,3,7,.65) 85%,rgba(2,1,4,.95))}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="vig"></div>
<div class="ui" id="title"><h1>记忆画廊</h1><div class="s">副本 #047 — 北京 · 北京</div></div>
<div class="ui" id="cap"></div>
<div class="ui" id="hint">WASD 走动 · 鼠标看 · 点击一幅画 → 旁白响起　（这是 VR 概念预览）</div>
<script type="importmap">
{ "imports": {
  "three": "__THREE_DATA_URL__"
}}
</script>
<script type="module">
import * as THREE from 'three';

const LINES = [
  "行李箱的轮子，在北京站前广场，迟疑了一下。",
  "在举目无亲的地方，人，才能成为另一个自己。",
  "凌晨四点，卸妆棉上是粉底、灰尘、和一句没说出口的台词。",
  "她举杯，笑意正好，西雅图的雨，都下到了北京。",
  "龙舌兰的杯底，映着极静极美的北京。",
  "直到窗外那些流动的灯火，都像他的侧脸，她才知道完了。",
];
const HUES = [
  ['#173a3a','#0a1418'], ['#3a1620','#150a0d'],
  ['#2a2238','#0e0a14'], ['#143a30','#0a1410'],
  ['#3a2a14','#140e08'], ['#10223a','#080a14'],
];

// ---------- placeholder "painting" texture (your images go here) ----------
function shade(hex,f){ const n=parseInt(hex.slice(1),16); let r=((n>>16)&255)*f,g=((n>>8)&255)*f,b=(n&255)*f;
  return `rgb(${Math.min(255,r)|0},${Math.min(255,g)|0},${Math.min(255,b)|0})`; }
function portrait(i){
  const w=512,h=680, cv=document.createElement('canvas'); cv.width=w; cv.height=h;
  const x=cv.getContext('2d');
  // luminous backdrop
  const g=x.createLinearGradient(0,0,0,h);
  g.addColorStop(0,shade(HUES[i%HUES.length][0],2.0)); g.addColorStop(1,HUES[i%HUES.length][1]);
  x.fillStyle=g; x.fillRect(0,0,w,h);
  // warm backlight bloom behind the head
  x.globalCompositeOperation='lighter';
  let rg=x.createRadialGradient(w*0.5,h*0.34,8,w*0.5,h*0.42,h*0.5);
  rg.addColorStop(0,'rgba(255,226,182,0.8)'); rg.addColorStop(0.45,'rgba(230,160,100,0.28)'); rg.addColorStop(1,'transparent');
  x.fillStyle=rg; x.fillRect(0,0,w,h);
  // elegant backlit female bust silhouette
  x.globalCompositeOperation='source-over';
  x.fillStyle='rgba(16,12,16,0.86)';
  x.beginPath();
  x.moveTo(w*0.10,h); x.quadraticCurveTo(w*0.20,h*0.66,w*0.40,h*0.585);
  x.lineTo(w*0.44,h*0.50); x.lineTo(w*0.56,h*0.50);
  x.quadraticCurveTo(w*0.80,h*0.66,w*0.90,h); x.closePath(); x.fill();
  x.beginPath(); x.ellipse(w*0.5,h*0.32,w*0.135,h*0.165,0,0,Math.PI*2); x.fill();   // head
  x.beginPath(); x.ellipse(w*0.61,h*0.205,w*0.07,h*0.055,0.4,0,Math.PI*2); x.fill(); // updo
  // rim light along the profile
  x.globalCompositeOperation='lighter';
  x.strokeStyle='rgba(255,228,182,0.6)'; x.lineWidth=3;
  x.beginPath(); x.moveTo(w*0.375,h*0.28); x.quadraticCurveTo(w*0.355,h*0.40,w*0.42,h*0.50); x.stroke();
  for(let k=0;k<1800;k++){ x.fillStyle=`rgba(255,255,255,${Math.random()*0.03})`; x.fillRect(Math.random()*w,Math.random()*h,1,1); }
  // gold frame border baked into the picture
  x.globalCompositeOperation='source-over';
  x.strokeStyle='rgba(184,150,100,0.95)'; x.lineWidth=12; x.strokeRect(16,16,w-32,h-32);
  x.strokeStyle='rgba(245,235,216,0.45)'; x.lineWidth=2;  x.strokeRect(28,28,w-56,h-56);
  x.fillStyle='rgba(245,235,216,0.5)'; x.font='italic 20px serif'; x.textAlign='right';
  x.fillText('· 你的图 ·', w-36, h-36);
  const t=new THREE.CanvasTexture(cv); t.anisotropy=4; return t;
}
function radialSprite(){
  const s=128,cv=document.createElement('canvas');cv.width=cv.height=s;const x=cv.getContext('2d');
  const g=x.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2); g.addColorStop(0,'rgba(255,235,200,1)'); g.addColorStop(1,'transparent');
  x.fillStyle=g;x.fillRect(0,0,s,s); return new THREE.CanvasTexture(cv);
}

// ---------- scene ----------
const renderer=new THREE.WebGLRenderer({canvas:document.getElementById('c'),antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.toneMapping=THREE.NoToneMapping;

const scene=new THREE.Scene();
scene.fog=new THREE.FogExp2(0x0b0810,0.020);
const camera=new THREE.PerspectiveCamera(62,innerWidth/innerHeight,0.05,200);
camera.position.set(0,1.7,-2.5);

scene.add(new THREE.AmbientLight(0x2c3a47,0.5));
const haloTex=radialSprite();

// floor (dark, faintly reflective look via low-rough standard)
const floor=new THREE.Mesh(new THREE.PlaneGeometry(80,160),
  new THREE.MeshStandardMaterial({color:0x0a0a10,roughness:0.4,metalness:0.6}));
floor.rotation.x=-Math.PI/2; floor.position.z=24; scene.add(floor);

// gallery paintings on both walls of a centre aisle
const panels=[];
for(let i=0;i<6;i++){
  const side=(i%2===0?-1:1), x=side*3.5, z=3+i*4.5;
  const grp=new THREE.Group(); grp.position.set(x,1.75,z);
  grp.rotation.y = side<0 ? Math.PI/2 : -Math.PI/2;   // face the centre aisle
  scene.add(grp);

  const frame=new THREE.Mesh(new THREE.PlaneGeometry(2.55,3.25),
    new THREE.MeshBasicMaterial({color:0xC9A063})); frame.position.z=-0.03; grp.add(frame);
  const pic=new THREE.Mesh(new THREE.PlaneGeometry(2.3,3.0),
    new THREE.MeshBasicMaterial({map:portrait(i)})); grp.add(pic);
  const halo=new THREE.Sprite(new THREE.SpriteMaterial({map:haloTex,color:0xffcaa0,
    transparent:true,opacity:0.22,blending:THREE.AdditiveBlending,depthWrite:false}));
  halo.scale.set(4.4,4.8,1); halo.position.z=-0.5; grp.add(halo);
  const pl=new THREE.PointLight(side<0?0xffb070:0x8fc0cf,4,8,2); pl.position.set(0,-1.3,1.2); grp.add(pl);

  panels.push(grp);
}

// dust / light motes
const N=900, pos=new Float32Array(N*3);
for(let i=0;i<N;i++){ pos[i*3]=(Math.random()-0.5)*40; pos[i*3+1]=Math.random()*8; pos[i*3+2]=Math.random()*60-4; }
const pg=new THREE.BufferGeometry(); pg.setAttribute('position',new THREE.BufferAttribute(pos,3));
const motes=new THREE.Points(pg,new THREE.PointsMaterial({map:haloTex,color:0xE8DFD3,size:0.12,
  transparent:true,opacity:0.5,blending:THREE.AdditiveBlending,depthWrite:false}));
scene.add(motes);

// far warm glow (city beyond the fog)
const cityHalo=new THREE.Sprite(new THREE.SpriteMaterial({map:haloTex,color:0x7A2A35,
  transparent:true,opacity:0.6,blending:THREE.AdditiveBlending,depthWrite:false}));
cityHalo.scale.set(40,20,1); cityHalo.position.set(0,6,46); scene.add(cityHalo);

// ---------- interaction (desktop walk) ----------
const keys={}; addEventListener('keydown',e=>keys[e.code]=true); addEventListener('keyup',e=>keys[e.code]=false);
let yaw=0,pitch=0,locked=false,auto=true,at=0.06;
addEventListener('click',()=>{ document.body.requestPointerLock&&document.body.requestPointerLock(); });
document.addEventListener('pointerlockchange',()=>{ locked=document.pointerLockElement===document.body; if(locked)auto=false; });
addEventListener('mousemove',e=>{ if(!locked)return; yaw-=e.movementX*0.0022; pitch=Math.max(-1.2,Math.min(1.2,pitch-e.movementY*0.0022)); });

const cap=document.getElementById('cap'); let capI=-1;
function nearestPanel(){ let best=99,bi=-1; panels.forEach((p,i)=>{const d=camera.position.distanceTo(p.position); if(d<best){best=d;bi=i;}}); return best<5?bi:-1; }

// ---------- camera presets for preview screenshots ----------
window.__view=(i)=>{
  const V=[
    [[0,1.7,-2.5],[0,1.65,16]],        // aisle overview
    [[-1.55,1.75,3],[-3.5,1.75,3]],    // hero: first left painting
    [[1.6,1.72,7.5],[3.5,1.75,7.5]],   // hero: right painting
    [[0,1.15,1.5],[0,1.8,20]],         // low dramatic aisle
  ][i]||[[0,1.7,-2.5],[0,1.65,16]];
  auto=false;
  camera.position.set(...V[0]); camera.lookAt(...V[1]);
  const bi=nearestPanel(); if(bi>=0){cap.textContent=LINES[bi];cap.classList.add('show');} else cap.classList.remove('show');
};

addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});

let t=0;
function loop(){
  t+=0.016;
  if(locked){
    const dir=new THREE.Vector3(Math.sin(yaw),0,Math.cos(yaw));
    const rt=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw));
    const sp=0.06;
    if(keys.KeyW)camera.position.addScaledVector(dir,sp);
    if(keys.KeyS)camera.position.addScaledVector(dir,-sp);
    if(keys.KeyA)camera.position.addScaledVector(rt,-sp);
    if(keys.KeyD)camera.position.addScaledVector(rt,sp);
    camera.position.y=1.6;
    const look=new THREE.Vector3().copy(camera.position).add(new THREE.Vector3(Math.sin(yaw)*Math.cos(pitch),Math.sin(pitch),Math.cos(yaw)*Math.cos(pitch)));
    camera.lookAt(look);
    const bi=nearestPanel(); if(bi!==capI){capI=bi; if(bi>=0){cap.textContent=LINES[bi];cap.classList.add('show');}else cap.classList.remove('show');}
  } else if(auto){
    at+=0.0016; const p=at%1;
    camera.position.set(Math.sin(p*Math.PI*4)*1.2, 1.7, -2+p*30);
    const bi=nearestPanel();
    const fwd=new THREE.Vector3(camera.position.x,1.62,camera.position.z+6);
    const look=bi>=0 ? fwd.lerp(panels[bi].position,0.45) : fwd;
    camera.lookAt(look);
    if(bi!==capI){capI=bi; if(bi>=0){cap.textContent=LINES[bi];cap.classList.add('show');}else cap.classList.remove('show');}
  }
  motes.rotation.y=t*0.01;
  const a=motes.geometry.attributes.position;
  for(let i=0;i<N;i++){ a.array[i*3+1]+=0.004; if(a.array[i*3+1]>8)a.array[i*3+1]=0; }
  a.needsUpdate=true;
  panels.forEach((p,i)=>{p.position.y=1.6+Math.sin(t*0.6+i)*0.04;});
  renderer.render(scene,camera);
  requestAnimationFrame(loop);
}
loop();
window.__ready=true;
window.__view(0);
</script>
</body>
</html>
