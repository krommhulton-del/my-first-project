<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>Clawd 桌面宠物</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="stage">
    <div id="bubble" class="interactive hidden"><span id="bubble-text"></span></div>

    <div id="chatbox" class="interactive hidden">
      <input id="chat-input" type="text" maxlength="200"
             placeholder="和 Clawd 说点什么…(Esc 关闭)" autocomplete="off" />
    </div>

    <div id="shadow"></div>

    <!-- Clawd:Claude Code 的经典 8-bit 像素螃蟹 🦀
         网格 16x14,每格 10px,viewBox 160x140 -->
    <div id="pet" class="interactive">
      <svg id="pet-svg" viewBox="0 0 160 140" xmlns="http://www.w3.org/2000/svg"
           shape-rendering="crispEdges">
        <g fill="#D97757">
          <!-- 两只钳子(带开口的像素蟹钳) -->
          <g id="claws">
            <rect x="10"  y="0"  width="20" height="10" />
            <rect x="40"  y="0"  width="20" height="10" />
            <rect x="10"  y="10" width="50" height="10" />
            <rect x="20"  y="20" width="30" height="10" />
            <rect x="100" y="0"  width="20" height="10" />
            <rect x="130" y="0"  width="20" height="10" />
            <rect x="100" y="10" width="50" height="10" />
            <rect x="110" y="20" width="30" height="10" />
          </g>

          <!-- 身体(圆角像素块) -->
          <g id="body-px">
            <rect x="30" y="30"  width="100" height="10" />
            <rect x="20" y="40"  width="120" height="10" />
            <rect x="10" y="50"  width="140" height="50" />
            <rect x="20" y="100" width="120" height="10" />
            <rect x="30" y="110" width="100" height="10" />
          </g>

          <!-- 四只小短腿 -->
          <g id="legs">
            <rect x="40"  y="120" width="10" height="20" />
            <rect x="60"  y="120" width="10" height="20" />
            <rect x="90"  y="120" width="10" height="20" />
            <rect x="110" y="120" width="10" height="20" />
          </g>
        </g>

        <!-- 脸(叠在身体上) -->
        <g id="face" fill="#221610">
          <!-- 默认方块眼 -->
          <g id="eyes">
            <rect class="eye" x="50" y="50" width="20" height="20" />
            <rect class="eye" x="90" y="50" width="20" height="20" />
          </g>
          <!-- 开心眯眼 > < -->
          <g id="happy-eyes">
            <rect x="50" y="50" width="10" height="10" />
            <rect x="60" y="60" width="10" height="10" />
            <rect x="50" y="70" width="10" height="10" />
            <rect x="100" y="50" width="10" height="10" />
            <rect x="90"  y="60" width="10" height="10" />
            <rect x="100" y="70" width="10" height="10" />
          </g>
          <!-- 睡觉的一字眼 -->
          <g id="sleep-eyes">
            <rect x="40" y="60" width="30" height="10" />
            <rect x="90" y="60" width="30" height="10" />
          </g>
          <!-- 被拎起来时的 o 嘴(惊讶) -->
          <rect id="mouth-o" x="70" y="85" width="20" height="10" />
        </g>
      </svg>
    </div>
  </div>

  <script src="pet.js"></script>
</body>
</html>
