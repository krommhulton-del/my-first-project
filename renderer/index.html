<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>Clawd 桌面宠物</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="stage">
    <div id="bubble" class="interactive hidden"><span id="bubble-text"></span></div>

    <div id="chatbox" class="interactive hidden">
      <input id="chat-input" type="text" maxlength="200"
             placeholder="和 Clawd 说点什么…(Esc 关闭)" autocomplete="off" />
    </div>

    <div id="shadow"></div>

    <!-- 道具:滑板(在身后/脚下) -->
    <div id="skateboard" class="prop">
      <i class="wheel w1"></i><i class="wheel w2"></i>
    </div>

    <!-- 官方 Clawd:Claude Code 启动画面的原版字符画
            ▐▛███▜▌
           ▝▜█████▛▘
             ▘▘ ▝▝
         逐格展开为 18x5 亚格网格(终端半格字符,亚格宽高比 1:2),
         每亚格 12x24,viewBox 216x120。眼睛是原版的负空间缺口,不加任何东西。 -->
    <div id="pet" class="interactive">
      <svg id="pet-svg" viewBox="0 0 216 120" xmlns="http://www.w3.org/2000/svg"
           shape-rendering="crispEdges">
        <g fill="#D97757">
          <g id="body-px">
            <!-- 行0:头顶  ▐▛███▜▌ 的上半 -->
            <rect x="36" y="0" width="144" height="24" />
            <!-- 行1:脸,两个眼睛缺口(▛▜ 的缺角)在 x=60 和 x=144 -->
            <rect x="36"  y="24" width="24" height="24" />
            <rect x="72"  y="24" width="72" height="24" />
            <rect x="156" y="24" width="24" height="24" />
            <!-- 行2:最宽的一行,两侧探出的小钳尖(▝ 和 ▘) -->
            <rect x="12" y="48" width="192" height="24" />
            <!-- 行3:身体下沿 -->
            <rect x="36" y="72" width="144" height="24" />
          </g>

          <!-- 行4:四只小脚  ▘▘ ▝▝ -->
          <g id="legs">
            <rect x="48"  y="96" width="12" height="24" />
            <rect x="72"  y="96" width="12" height="24" />
            <rect x="132" y="96" width="12" height="24" />
            <rect x="156" y="96" width="12" height="24" />
          </g>

          <!-- 眨眼/睡觉:用身体同色把眼睛缺口盖住(= 闭眼),不改变造型 -->
          <g id="eyelids">
            <rect x="60"  y="24" width="12" height="24" />
            <rect x="144" y="24" width="12" height="24" />
          </g>
        </g>
      </svg>
    </div>

    <!-- 道具:笔记本电脑(挡在身前,像素屏幕会打字) -->
    <div id="laptop" class="prop">
      <div id="lap-screen"><i></i><i></i><i></i><b id="lap-caret"></b></div>
      <div id="lap-base"></div>
    </div>
  </div>

  <script src="pet.js"></script>
</body>
</html>
