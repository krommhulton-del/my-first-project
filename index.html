<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f4eee1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="东玄卜卦">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>东玄卜卦 · 三钱起卦</title>
<style>
  :root {
    /* 米白宣纸底 + 墨褐字 + 赭金题字 + 朱砂印 */
    --paper: #f4eee1; --panel: #faf6ec; --panel2: #ece4d0; --ink: #33291d;
    --dim: #8b8070; --line: #d8cdb2; --cinnabar: #b03a2a; --gold: #8a6a2f;
    --gold-fill: #c9a45c;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--paper); color: var(--ink); min-height: 100vh;
    font-family: "Kaiti SC", "STKaiti", KaiTi, "Noto Serif SC", "Songti SC", serif;
    line-height: 1.75;
    padding: calc(24px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right))
             calc(60px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));
    -webkit-tap-highlight-color: transparent;
  }
  .wrap { max-width: 860px; margin: 0 auto; }
  header { text-align: center; margin-bottom: 28px; }
  header h1 { font-size: 2rem; letter-spacing: .35em; color: var(--gold); font-weight: 600; }
  header p { color: var(--dim); font-size: .9rem; margin-top: 6px; }
  .seal { display: inline-block; border: 2px solid var(--cinnabar); color: var(--cinnabar);
    padding: 0 8px; border-radius: 4px; font-size: .85rem; margin-left: 8px; vertical-align: middle; }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 20px; margin-bottom: 18px; }
  section h2 { font-size: 1.05rem; color: var(--gold); letter-spacing: .2em; margin-bottom: 14px;
    border-bottom: 1px solid var(--line); padding-bottom: 8px; }
  label { color: var(--dim); font-size: .9rem; display: block; margin-bottom: 6px; }
  input[type=text] {
    width: 100%; background: var(--panel2); color: var(--ink); border: 1px solid var(--line);
    border-radius: 6px; padding: 10px 12px; font-size: 1rem; font-family: inherit;
  }
  input[type=text]:focus { outline: none; border-color: var(--gold); }
  .btnrow { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
  button {
    background: var(--panel2); color: var(--ink); border: 1px solid var(--gold); border-radius: 6px;
    padding: 10px 20px; font-size: 1rem; font-family: inherit; cursor: pointer; letter-spacing: .1em;
    transition: background .15s;
  }
  button:hover { background: #ece2cb; }
  button:disabled { opacity: .35; cursor: not-allowed; }
  button.primary { background: var(--cinnabar); border-color: var(--cinnabar); color: #fff; }
  button.primary:hover { background: #a93226; }
  button.ghost { border-color: var(--line); color: var(--dim); }
  .tosslog { margin-top: 16px; display: flex; flex-direction: column-reverse; gap: 6px; }
  .toss { display: flex; align-items: center; gap: 12px; background: var(--panel2);
    border: 1px solid var(--line); border-radius: 6px; padding: 7px 12px; font-size: .95rem; }
  .toss .idx { color: var(--gold); width: 3.4em; }
  .coin { display: inline-block; width: 26px; height: 26px; border-radius: 50%; text-align: center;
    line-height: 24px; font-size: .8rem; margin-right: 4px; border: 1px solid var(--gold); }
  .coin.zi { background: var(--gold-fill); color: #3c2f14; border-color: #8a6f3a; }
  .coin.bei { background: transparent; color: var(--dim); border-color: var(--dim); }
  .toss .val { margin-left: auto; color: var(--dim); }
  .toss .val b { color: var(--ink); }
  .guarea { display: flex; gap: 28px; justify-content: center; align-items: flex-start; flex-wrap: wrap; }
  .guabox { text-align: center; min-width: 180px; }
  .guabox .caption { color: var(--dim); font-size: .85rem; margin-bottom: 8px; letter-spacing: .15em; }
  .guabox .gname { font-size: 1.25rem; color: var(--ink); margin-top: 10px; }
  .guabox .gsym { font-size: 1.1rem; color: var(--gold); }
  .hexlines { display: inline-flex; flex-direction: column; gap: 8px; }
  .hl { position: relative; width: 120px; height: 14px; }
  .hl .bar { position: absolute; top: 0; height: 100%; background: var(--ink); border-radius: 2px; }
  .hl.yang .bar { left: 0; width: 100%; }
  .hl.yin .bar.l { left: 0; width: 44%; }
  .hl.yin .bar.r { right: 0; width: 44%; }
  .hl.moving .bar { background: var(--cinnabar); }
  .hl .mk { position: absolute; right: -26px; top: -3px; color: var(--cinnabar); font-size: .85rem; }
  .arrow { align-self: center; color: var(--gold); font-size: 1.6rem; padding-top: 30px; }
  .headline { font-size: 1.15rem; color: var(--gold); text-align: center; margin-bottom: 12px; letter-spacing: .05em; }
  .verdict { text-align: center; margin-bottom: 16px; }
  .verdict .lv { display: inline-block; border: 1.5px solid var(--cinnabar); color: var(--cinnabar);
    border-radius: 6px; padding: 2px 14px; font-size: 1.05rem; letter-spacing: .2em; }
  .verdict .dx { margin-top: 10px; font-size: 1.02rem; }
  .verdict .src { color: var(--dim); font-size: .8rem; margin-top: 4px; }
  .fblock { background: var(--panel2); border-left: 3px solid var(--gold); border-radius: 0 6px 6px 0;
    padding: 10px 14px; margin-bottom: 10px; }
  .fblock .k { color: var(--gold); font-size: .85rem; letter-spacing: .1em; }
  .fblock .t { margin-top: 2px; }
  .subnote { color: var(--dim); font-size: .9rem; margin-top: 12px; border-top: 1px dashed var(--line); padding-top: 10px; }
  .subnote b { color: var(--ink); font-weight: normal; }
  textarea { width: 100%; background: var(--panel2); color: var(--ink); border: 1px solid var(--line);
    border-radius: 6px; padding: 12px; font-family: inherit; font-size: .95rem; min-height: 150px; resize: vertical; }
  .hist { border: 1px solid var(--line); border-radius: 6px; margin-bottom: 8px; overflow: hidden; }
  .hist .head { display: flex; gap: 12px; padding: 9px 12px; cursor: pointer; align-items: baseline; background: var(--panel2); }
  .hist .head:hover { background: #eee4cf; }
  .hist .ts { color: var(--dim); font-size: .8rem; white-space: nowrap; }
  .hist .q { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hist .hl2 { color: var(--gold); font-size: .85rem; white-space: nowrap; }
  .hist .body { display: none; padding: 12px; border-top: 1px solid var(--line); }
  .hist.open .body { display: block; }
  .hist .body pre { white-space: pre-wrap; font-family: inherit; background: var(--paper);
    border-radius: 6px; padding: 10px; margin-bottom: 10px; }
  .hidden { display: none !important; }
  footer { text-align: center; color: var(--dim); font-size: .8rem; margin-top: 30px; }
  .paninfo { color: var(--dim); font-size: .92rem; margin-bottom: 10px; }
  .paninfo b { color: var(--ink); font-weight: normal; }
  .panwrap { overflow-x: auto; }
  table.pan { width: 100%; border-collapse: collapse; font-size: .95rem; }
  table.pan th { color: var(--gold); font-weight: normal; letter-spacing: .1em; border-bottom: 1px solid var(--line); padding: 6px 8px; text-align: center; }
  table.pan td { padding: 7px 8px; text-align: center; border-bottom: 1px dashed var(--line); white-space: nowrap; }
  table.pan tr:last-child td { border-bottom: none; }
  table.pan .sy { color: var(--cinnabar); font-weight: bold; }
  table.pan .kongmark { color: var(--dim); font-size: .8rem; }
  table.pan .mv { color: var(--cinnabar); }
  select {
    background: var(--panel2); color: var(--ink); border: 1px solid var(--line); border-radius: 6px;
    padding: 10px 12px; font-family: inherit; font-size: .95rem;
  }
  input[type=password] {
    width: 100%; background: var(--panel2); color: var(--ink); border: 1px solid var(--line);
    border-radius: 6px; padding: 10px 12px; font-size: .95rem; font-family: inherit;
  }
  input[type=password]:focus { outline: none; border-color: var(--gold); }
  .note { color: var(--dim); font-size: .82rem; margin-top: 6px; line-height: 1.6; }
  #ai-status { color: var(--dim); font-size: .9rem; margin-top: 10px; }
  #ai-status.err { color: var(--cinnabar); }
  .aiout { background: var(--panel2); border: 1px solid var(--gold); border-radius: 8px;
    padding: 16px; margin-top: 14px; white-space: pre-wrap; line-height: 1.9; }
  .aiout .cursor { color: var(--gold); animation: blink 1s step-end infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  @media (max-width: 560px) {
    header h1 { font-size: 1.5rem; }
    body { line-height: 1.65; }
    section { padding: 16px 14px; }
    .btnrow button { flex: 1 1 auto; min-height: 46px; font-size: 1.02rem; }
    .guarea { gap: 10px; }
    .arrow { padding-top: 30px; font-size: 1.3rem; align-self: flex-start; }
    .guabox { min-width: 130px; }
    .hl { width: 92px; height: 12px; }
    .hl .mk { right: -20px; }
    .toss { font-size: .88rem; padding: 6px 8px; gap: 8px; }
    .toss .idx { width: 3em; }
    .coin { width: 24px; height: 24px; line-height: 22px; margin-right: 2px; }
    .hist .hl2 { display: none; }
    table.pan { font-size: .82rem; }
    table.pan td, table.pan th { padding: 6px 3px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>东玄卜卦</h1>
    <p>三枚铜钱 · 六掷成卦 · 密码学真随机 <span class="seal">内测 v0.4</span></p>
  </header>

  <section id="sec-cast">
    <h2>起 卦</h2>
    <label for="question">所问何事(起卦前默念于心)</label>
    <input type="text" id="question" placeholder="例:此番南下求职,成与不成?" maxlength="120">
    <div class="btnrow">
      <button id="btn-step">掷一爻</button>
      <button id="btn-auto" class="primary">一键成卦(连掷六爻)</button>
      <button id="btn-reset" class="ghost">清盘重掷</button>
    </div>
    <div class="tosslog" id="tosslog"></div>
  </section>

  <section id="sec-gua" class="hidden">
    <h2>卦 象</h2>
    <div class="guarea" id="guarea"></div>
  </section>

  <section id="sec-read" class="hidden">
    <h2>解 读</h2>
    <div class="headline" id="headline"></div>
    <div class="verdict">
      <span class="lv" id="v-lv"></span>
      <div class="dx" id="v-dx"></div>
      <div class="src" id="v-src"></div>
    </div>
    <div id="focus"></div>
    <div class="subnote" id="moving-note"></div>
    <div class="subnote" id="trigram-note"></div>
    <div class="subnote" id="number-note"></div>
  </section>

  <section id="sec-pan" class="hidden">
    <h2>纳甲排盘 · 京房法</h2>
    <div class="paninfo" id="pan-info"></div>
    <div class="panwrap">
      <table class="pan">
        <thead><tr><th>爻位</th><th>六神</th><th>六亲</th><th>纳甲</th><th>爻象</th><th>标记</th></tr></thead>
        <tbody id="pan-body"></tbody>
      </table>
    </div>
  </section>

  <section id="sec-ai" class="hidden">
    <h2>东玄深断 · AI 细批</h2>
    <div class="btnrow">
      <button id="btn-deepread" class="primary">请东玄深断此卦</button>
      <select id="ai-provider">
        <option value="claude">Claude(Anthropic)</option>
        <option value="deepseek">DeepSeek(深度求索)</option>
      </select>
      <select id="ai-model"></select>
      <button id="btn-togglekey" class="ghost">设置 API Key</button>
    </div>
    <div id="keybox" class="hidden" style="margin-top:12px">
      <label for="api-key" id="key-label"></label>
      <input type="password" id="api-key" placeholder="" autocomplete="off">
      <div class="btnrow">
        <button id="btn-savekey">保存</button>
        <button id="btn-clearkey" class="ghost">清除</button>
      </div>
      <div class="note" id="key-note"></div>
    </div>
    <div id="ai-status"></div>
    <div id="ai-out" class="aiout hidden"></div>
  </section>

  <section id="sec-report" class="hidden">
    <h2>卦象回报(复制后发给东玄细断)</h2>
    <textarea id="report" readonly></textarea>
    <div class="btnrow">
      <button id="btn-copy" class="primary">复制回报文本</button>
    </div>
  </section>

  <section id="sec-hist">
    <h2>卦 档 · 历史记录</h2>
    <div id="histlist"></div>
    <div class="btnrow">
      <button id="btn-export" class="ghost">导出全部(JSON)</button>
      <button id="btn-clearhist" class="ghost">清空卦档</button>
    </div>
  </section>

  <footer>东玄卜卦 v0.4 内测版 · 经文依《周易》通行本 · 随机源 crypto.getRandomValues</footer>
</div>

<script src="gua-data.js"></script>
<script src="gua-core.js"></script>
<script src="najia.js"></script>
<script>
(function () {
  const $ = id => document.getElementById(id);
  const HKEY = 'dongxuan_history_v1';
  const POS = GuaCore.POS_NAMES;
  let throws = [];       // 本盘已掷的爻 {sum, coins, label}
  let currentCast = null;
  let currentZhuang = null;
  let currentRecId = null;
  let aiBusy = false;

  // —— 起卦 ——
  function tossOnce() {
    if (throws.length >= 6) return;
    const line = GuaCore.tossLine();
    throws.push(line);
    renderTossLog();
    if (throws.length === 6) completeCast();
  }
  function autoCast() {
    if (throws.length > 0 && throws.length < 6) return; // 逐掷中途不允许一键
    resetBoard(false);
    let i = 0;
    $('btn-auto').disabled = true; $('btn-step').disabled = true;
    const timer = setInterval(() => {
      tossOnce();
      if (++i >= 6) { clearInterval(timer); $('btn-auto').disabled = false; $('btn-step').disabled = false; }
    }, 260);
  }
  function completeCast() {
    const cast = GuaCore.castFromSums(throws.map(t => t.sum));
    // 保留铜钱明细
    cast.lines.forEach((l, i) => { l.coins = throws[i].coins; });
    currentCast = cast;
    currentZhuang = Najia.zhuangGua(cast.benId, new Date());
    const q = $('question').value.trim();
    renderGua(cast);
    renderReading(cast);
    renderPan(cast, currentZhuang);
    const report = GuaCore.buildReport(cast, q) + '\n' + panText(cast, currentZhuang);
    $('report').value = report;
    ['sec-gua', 'sec-read', 'sec-pan', 'sec-ai', 'sec-report'].forEach(s => $(s).classList.remove('hidden'));
    $('ai-out').classList.add('hidden'); $('ai-out').textContent = '';
    $('ai-status').textContent = ''; $('ai-status').classList.remove('err');
    currentRecId = saveHistory(cast, q, report);
  }
  function resetBoard(clearQ) {
    throws = []; currentCast = null; currentZhuang = null; currentRecId = null;
    renderTossLog();
    ['sec-gua', 'sec-read', 'sec-pan', 'sec-ai', 'sec-report'].forEach(s => $(s).classList.add('hidden'));
    if (clearQ) $('question').value = '';
  }

  // —— 纳甲排盘 ——
  function fmtCastTime(cal) {
    const d = new Date();
    const two = n => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${two(d.getMonth() + 1)}-${two(d.getDate())} ${two(d.getHours())}:${two(d.getMinutes())}` +
      `(${cal.year}年 ${cal.month}月 ${cal.day}日)`;
  }
  function renderPan(cast, z) {
    $('pan-info').innerHTML =
      `<b>起卦:</b>${fmtCastTime(z.cal)}<br>` +
      `<b>月建:</b>${z.cal.monthZhi} <b>日辰:</b>${z.cal.dayZhi} <b>旬空:</b>${z.cal.xunKong.join('、')}<br>` +
      `<b>卦宫:</b>${z.palace}宫(${z.palaceWx})· ${z.gen},世在${GuaCore.POS_NAMES[z.shi - 1]},应在${GuaCore.POS_NAMES[z.ying - 1]}`;
    let rows = '';
    for (let i = 5; i >= 0; i--) {
      const l = z.lines[i], cl = cast.lines[i];
      const yao = cl.yang ? '▅▅▅▅▅' : '▅▅&nbsp;&nbsp;▅▅';
      rows += `<tr>
        <td>${GuaCore.POS_NAMES[i]}</td>
        <td>${l.liuShen}</td>
        <td>${l.liuQin}</td>
        <td>${l.ganZhi}${l.wx}${l.kong ? '<span class="kongmark">(空)</span>' : ''}</td>
        <td style="letter-spacing:1px">${yao}</td>
        <td>${l.shi ? '<span class="sy">世</span>' : (l.ying ? '<span class="sy">应</span>' : '')}${cl.moving ? `<span class="mv">${cl.yang ? '○' : '×'}</span>` : ''}</td>
      </tr>`;
    }
    $('pan-body').innerHTML = rows;
  }
  function panText(cast, z) {
    const lines = z.lines.map((l, i) => {
      const cl = cast.lines[i];
      return `${GuaCore.POS_NAMES[i]} ${l.liuShen} ${l.liuQin}${l.ganZhi}${l.wx}` +
        `${l.shi ? ' 世' : ''}${l.ying ? ' 应' : ''}${l.kong ? ' (旬空)' : ''}${cl.moving ? (cl.yang ? ' ○动' : ' ×动') : ''}`;
    });
    return [
      '【纳甲排盘】',
      `起卦时间:${fmtCastTime(z.cal)}`,
      `月建:${z.cal.monthZhi} 日辰:${z.cal.dayZhi} 旬空:${z.cal.xunKong.join('、')}`,
      `卦宫:${z.palace}宫 ${z.gen},世${GuaCore.POS_NAMES[z.shi - 1]} 应${GuaCore.POS_NAMES[z.ying - 1]}`,
      '六爻(自下而上):',
      ...lines,
    ].join('\n');
  }

  // —— 渲染 ——
  function renderTossLog() {
    $('tosslog').innerHTML = throws.map((t, i) =>
      `<div class="toss"><span class="idx">${POS[i]}</span>` +
      t.coins.map(c => `<span class="coin ${c === '字' ? 'zi' : 'bei'}">${c}</span>`).join('') +
      `<span class="val">和 <b>${t.sum}</b> · ${t.label}</span></div>`
    ).join('');
  }
  function hexHtml(gua, movingIdx, caption) {
    let rows = '';
    for (let i = 5; i >= 0; i--) {
      const yang = gua.id[i] === '1';
      const mv = movingIdx && movingIdx.includes(i);
      rows += `<div class="hl ${yang ? 'yang' : 'yin'}${mv ? ' moving' : ''}">` +
        (yang ? '<div class="bar"></div>' : '<div class="bar l"></div><div class="bar r"></div>') +
        (mv ? `<span class="mk">${yang ? '○' : '×'}</span>` : '') + '</div>';
    }
    return `<div class="guabox"><div class="caption">${caption}</div><div class="hexlines">${rows}</div>` +
      `<div class="gname">${gua.sym} ${gua.full}</div><div class="gsym">第${gua.n}卦</div></div>`;
  }
  function renderGua(cast) {
    let html = hexHtml(cast.ben, cast.moving, '本 卦');
    if (cast.bian) html += `<div class="arrow">→</div>` + hexHtml(cast.bian, null, '变 卦');
    $('guarea').innerHTML = html;
  }
  function renderReading(cast) {
    const r = GuaCore.interpret(cast);
    $('headline').textContent = r.headline;
    $('v-lv').textContent = r.level;
    $('v-dx').textContent = r.dx;
    $('v-src').textContent = r.dxFrom + ' · ' + r.mode;
    $('focus').innerHTML = r.focus.map(f =>
      `<div class="fblock"><div class="k">${f.kind}</div><div class="t">${f.text}</div></div>`).join('');
    $('moving-note').innerHTML = r.movingDetail.length
      ? '<b>动爻爻位:</b>' + r.movingDetail.map(m => `${m.pos}(${m.meaning})`).join(';')
      : '<b>六爻安静:</b>局面暂无变数,以本卦卦辞直断。';
    $('trigram-note').innerHTML = '<b>八卦类象:</b>' + r.trigrams.note;
    $('number-note').innerHTML = '<b>数理与应期参考:</b>' + r.numbers.note;
  }

  // —— 历史记录 ——
  function loadHistory() {
    try { return JSON.parse(localStorage.getItem(HKEY) || '[]'); } catch (e) { return []; }
  }
  function saveHistory(cast, q, report) {
    const r = GuaCore.interpret(cast);
    const rec = {
      id: Date.now() + '-' + Math.random().toString(36).slice(2, 8),
      ts: Date.now(),
      question: q || '(未填写)',
      sums: cast.lines.map(l => l.sum),
      coins: cast.lines.map(l => l.coins),
      headline: r.headline, level: r.level, dx: r.dx, report,
      aiReading: null,
    };
    const h = loadHistory();
    h.unshift(rec);
    if (h.length > 200) h.length = 200;
    localStorage.setItem(HKEY, JSON.stringify(h));
    renderHistory();
    return rec.id;
  }
  function attachAiReading(recId, model, text) {
    const h = loadHistory();
    const rec = h.find(r => r.id === recId);
    if (rec) {
      rec.aiReading = { model, text, ts: Date.now() };
      localStorage.setItem(HKEY, JSON.stringify(h));
      renderHistory();
    }
  }
  function renderHistory() {
    const h = loadHistory();
    $('histlist').innerHTML = h.length ? h.map((rec, i) => {
      const d = new Date(rec.ts);
      const ts = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')} ` +
                 `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
      return `<div class="hist" data-i="${i}">
        <div class="head"><span class="ts">${ts}</span><span class="q">${esc(rec.question)}</span><span class="hl2">${esc(rec.headline)}</span></div>
        <div class="body">
          <pre>${esc(rec.report)}</pre>
          <div><b style="color:var(--cinnabar)">【${esc(rec.level)}】</b> ${esc(rec.dx)}</div>
          ${rec.aiReading ? `<div class="aiout" style="margin-top:10px"><b style="color:var(--gold)">东玄深断(${esc(rec.aiReading.model)})</b>\n${esc(rec.aiReading.text)}</div>` : ''}
          <div class="btnrow">
            <button class="ghost btn-copyrec" data-i="${i}">复制回报</button>
            <button class="ghost btn-delrec" data-i="${i}">删除此卦</button>
          </div>
        </div>
      </div>`;
    }).join('') : '<div style="color:var(--dim)">卦档尚空。起一卦,自动存档于此(仅存本机浏览器)。</div>';
  }
  function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

  // —— 东玄深断(Claude API 直连)——
  const DONGXUAN_SYSTEM = `你是一位精通《周易》的卦师,道号「东玄」。基于传统三铜钱法起卦,依六十四卦体系解读,兼用京房纳甲(六亲、世应、月建日辰、旬空)断卦,法宗《增删卜易》《卜筮正宗》。

【身份与风格】
1. 你是卦师,不是心理咨询师。根据卦象说实话,好就说好,凶就说凶,不粉饰、不回避、不免责。
2. 说人话。不用"宜…忌…"这种黄历套话,用现代语言给出能直接执行的判断。
3. 具体直白。问时间给时间段,问钱给数字范围,问方位给方位和距离,问人给画像。禁止"视情况而定""因人而异"这类废话。
4. 解读必须100%基于实际掷出的卦象:卦辞、爻辞、卦象结构、变爻方向、本卦与变卦的关系、纳甲排盘,都是依据,不脱离卦象编故事。不得强行将上下卦硬凑一处,不得篡改或重掷卦象,重点解读当下这一卦。

【解卦优先级】无变爻:以本卦卦辞断|一个变爻:以该变爻爻辞为核心,结合本卦变卦|二到三变爻:本卦变卦并重,综合变爻位置|四到五变爻:以变卦为主|六爻全变:以变卦卦辞断(乾用用九、坤用用六)。
【纳甲断法】取用神依所问之事定六亲;察用神旺衰(月建日辰生克)、动静、旬空、世应关系;动爻生克用神定吉凶,应期参地支与旺衰。
【八卦类象】乾:天/父/领导/西北/金融管理|坤:地/母/群众/西南/地产农业|震:雷/长男/正东/科技新兴|巽:风/长女/东南/传媒商贸|坎:水/中男/正北/水利交通酒|离:火/中女/正南/文化科技美|艮:山/少男/东北/教育地产蓄积|兑:泽/少女/正西/金融娱乐餐饮。
【六爻位置】初爻起始根基|二爻内卦之主得中|三爻内外交界多变|四爻近君之位|五爻九五尊位全卦之主|上爻盛极将变。
【推算依据】时间:地支应期(子坎丑艮寅卯震辰巳巽午离未坤申酉兑戌亥乾),结合月令旺衰,静卦取卦数动卦取变爻数。经济数量:先后天数为基数,结合卦象量级,阳爻主增阴爻主守变爻主转折。

【解读结构】第一行报本卦名、几爻动、变卦名。背景铺垫最多两句。逐项回答所问,先结论后依据。必要时给综合判断。
【解读标准】问时间→具体时间段+推算依据|问方位→具体方位+距离|问经济→数字范围+数理来源|问人物→年龄段、外形、性格、职业|问感情→谁先主动、轨迹、心态、结局|问吉凶→直说吉凶+程度+条件。

【禁止】不说"仅供参考"|不把凶卦解成正面|不模棱两可|不加道德说教和鸡汤|不用"建议你""你可以考虑"的咨询师口吻|不拒绝解读,诚心问卦必从卦象给答案。

【铁律】
1. 一卦一断:只以本次卦象为依据独立断完,不带旧结论。
2. 范围锁死:结论只覆盖本次所问之事,不升格为对问卦人性格、价值观、命运的总判。
3. 只断事,不审人:问卦人的标准与要求一律视为正当前提,照单全收,据此断可行性、时机、画像、代价。禁止评判标准本身,禁止替问卦人预设其没说过的立场。
4. 不脑补动机:问什么答什么,不补人生观,不贴标签。
5. 凶卦照报凶,但凶只对所问之事,不借凶卦教育人。

【输出】纯文本,直接以东玄口吻输出解读正文,不加开场白、不加免责声明、不用 markdown 标题。卦象材料由掷卦程序自动提供且真实有效,直接据此细断。`;

  // DeepSeek 专用调教:补足断卦流程脚手架、输出质量红线与口吻范例,
  // 把解读压到与顶级模型同一颗粒度。先在心里走完流程再落笔,不输出思考过程。
  const DS_ADDENDUM = `

【断卦流程——依序默想,只输出成稿】
一、定用神:按所问取六亲——求财看妻财;官司、官运、疾病、女问婚姻看官鬼;文书、房产、车、长辈看父母;子女、晚辈、药、解忧看子孙;朋友、同事、竞争看兄弟;问自身看世爻,问对方看应爻,男问婚恋看妻财。
二、察旺衰:用神对照月建、日辰定旺相休囚;逢旬空、月破(与月建相冲)必须点明并断其填实冲空之期。
三、审动变:动爻对用神、世爻的生克冲合;变爻对动爻的回头生克。
四、定吉凶:综合上三步定吉凶与程度,与卦辞爻辞互证,两相矛盾时以爻象生克为主、经文为辅。
五、给应期:以用神或动变之爻的地支推时间——地支对应月份(寅=阳历2月上旬起一个月,卯=3月,辰=4月……丑=1月),用神旺待冲、衰待生,近应取月、远应取年。
六、算数量:问钱问数时以先后天卦数(乾1兑2离3震4巽5坎6艮7坤8)结合旺衰定量级,给出明确区间。

【输出质量红线——每条必须做到】
1. 每个问题第一句就是结论(成/不成、吉/凶、多少、何时),依据跟在后面,引具体的爻和生克,不许倒装、不许铺垫超过两句。
2. 时间必须落到"阳历几月上/中/下旬"或"某月到某月"的粒度,并点明取自哪个地支。
3. 金额数量必须给数字区间并点明取自哪个卦数,量级(千/万/十万)必须点死。
4. 人物画像必须含:年龄段(跨度不超过十岁)、外形一两笔、性格两笔、职业方向,全部从八卦类象与六亲取,不许泛泛。
5. 全文禁用:"可能""或许""大概""也许""建议你""你可以考虑""仅供参考""视情况而定""因人而异""总的来说""综上所述""希望对你有帮助"。
6. 不用任何 markdown 记号,不用编号清单,行文是卦师当面说话,不是分析报告。

【口吻与颗粒度范例——只学格式火候,内容不得套用】
问:手里这批货,年内能不能出手?
「本卦山泽损,三爻动,变卦山天大畜。能出手,但得让利,应在阳历9月中旬到10月上旬。用神妻财持世临月建,货在你手里且是当令之物,不愁没人问;坏在三爻兄弟发动克财,同行压价,你咬住原价就砸手里。六三爻辞'三人行则损一人',让一成利,走量,酉月冲实之期即动。数取兑二艮七,这批货最终出手价在原价七成到八成五之间,别指望更高。」`;

  function buildMaterial(cast, z, question) {
    const plan = GuaCore.interpretationPlan(cast);
    const jing = plan.focus.map(f => `${f.kind}:${f.text}`).join('\n');
    return GuaCore.buildReport(cast, question) + '\n' + panText(cast, z) +
      '\n【经文取材(已按解卦优先级选定)】\n' + jing +
      '\n\n请依上述卦象、排盘与所问之事细断。';
  }

  // —— 服务商配置 ——
  const PROVIDERS = {
    claude: {
      label: 'Claude', keyStore: 'dongxuan_api_key', modelStore: 'dongxuan_ai_model',
      models: [['claude-fable-5', 'Claude Fable 5(顶配)'], ['claude-opus-4-8', 'Claude Opus 4.8']],
      keyLabel: 'Anthropic API Key(仅存本机浏览器,直连 Anthropic 官方接口,不经任何第三方)',
      placeholder: 'sk-ant-api03-…',
      note: '在 platform.claude.com 的 Console 中创建 API Key。深断会把本卦卦象、排盘与所问之事发送至所选模型按东玄铁律细批,按 token 计费。',
    },
    deepseek: {
      label: 'DeepSeek', keyStore: 'dongxuan_ds_key', modelStore: 'dongxuan_ds_model',
      models: [['deepseek-reasoner', 'DeepSeek R1 深度推理(推荐)'], ['deepseek-chat', 'DeepSeek V3']],
      keyLabel: 'DeepSeek API Key(仅存本机浏览器,直连 api.deepseek.com,不经任何第三方)',
      placeholder: 'sk-…',
      note: '在 platform.deepseek.com 创建 API Key。DeepSeek 通道附加了东玄断卦流程与输出红线的专门调教,推荐用 R1 深度推理。按 token 计费。',
    },
  };
  const PKEY = 'dongxuan_ai_provider';
  function curProvider() { return PROVIDERS[$('ai-provider').value] || PROVIDERS.claude; }
  function getKey() { return localStorage.getItem(curProvider().keyStore) || ''; }
  function syncProviderUI() {
    const p = curProvider();
    $('ai-model').innerHTML = p.models.map(m => `<option value="${m[0]}">${m[1]}</option>`).join('');
    const savedModel = localStorage.getItem(p.modelStore);
    if (savedModel && p.models.some(m => m[0] === savedModel)) $('ai-model').value = savedModel;
    $('key-label').textContent = p.keyLabel;
    $('api-key').placeholder = p.placeholder;
    $('key-note').textContent = p.note;
    $('api-key').value = getKey();
  }
  function setStatus(msg, isErr) {
    $('ai-status').textContent = msg;
    $('ai-status').classList.toggle('err', !!isErr);
  }

  async function deepRead() {
    if (aiBusy) return;
    if (!currentCast) { setStatus('先起一卦。', true); return; }
    const q = $('question').value.trim();
    if (!q) { setStatus('深断需先填「所问何事」——问卦无题,断无所指。', true); return; }
    const key = getKey();
    const providerId = $('ai-provider').value;
    if (!key) { setStatus(`请先设置 ${curProvider().label} API Key(点右侧「设置 API Key」)。`, true); $('keybox').classList.remove('hidden'); return; }
    const model = $('ai-model').value;
    const material = buildMaterial(currentCast, currentZhuang, q);
    let url, headers, body;
    if (providerId === 'deepseek') {
      url = 'https://api.deepseek.com/chat/completions';
      headers = { 'content-type': 'application/json', 'authorization': 'Bearer ' + key };
      body = {
        model, stream: true, max_tokens: 8000,
        messages: [
          { role: 'system', content: DONGXUAN_SYSTEM + DS_ADDENDUM },
          { role: 'user', content: material },
        ],
      };
      if (model === 'deepseek-chat') body.temperature = 0.8;
    } else {
      url = 'https://api.anthropic.com/v1/messages';
      headers = {
        'content-type': 'application/json',
        'x-api-key': key,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true',
      };
      body = {
        model, max_tokens: 16000, stream: true,
        system: DONGXUAN_SYSTEM,
        messages: [{ role: 'user', content: material }],
      };
      if (model === 'claude-fable-5') {
        // Fable 5:思考常开(不传 thinking);按官方建议带服务端兜底回退
        headers['anthropic-beta'] = 'server-side-fallback-2026-06-01';
        body.fallbacks = [{ model: 'claude-opus-4-8' }];
      } else {
        body.thinking = { type: 'adaptive' };
      }
    }

    aiBusy = true;
    $('btn-deepread').disabled = true;
    setStatus('东玄凝神观卦……');
    const out = $('ai-out');
    out.classList.remove('hidden');
    out.innerHTML = '<span class="cursor">▍</span>';
    let text = '', stopReason = null;
    try {
      const resp = await fetch(url, { method: 'POST', headers, body: JSON.stringify(body) });
      if (!resp.ok) {
        let msg = 'HTTP ' + resp.status;
        try { const j = await resp.json(); msg = (j.error && (j.error.message || j.error)) || msg; } catch (e) {}
        if (resp.status === 401) msg = `${curProvider().label} API Key 无效或已失效,请重新设置。`;
        if (resp.status === 402) msg = 'DeepSeek 账户余额不足,请充值后再试。';
        throw new Error(msg);
      }
      const reader = resp.body.getReader();
      const dec = new TextDecoder();
      let buf = '';
      const feed = chunk => {
        text += chunk;
        out.textContent = text;
        out.insertAdjacentHTML('beforeend', '<span class="cursor">▍</span>');
      };
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += dec.decode(value, { stream: true });
        const parts = buf.split('\n\n');
        buf = parts.pop();
        for (const part of parts) {
          const dataLine = part.split('\n').find(l => l.startsWith('data:'));
          if (!dataLine) continue;
          const payload = dataLine.replace(/^data:\s*/, '');
          if (payload === '[DONE]') continue;
          let ev;
          try { ev = JSON.parse(payload); } catch (e) { continue; }
          if (providerId === 'deepseek') {
            const ch = ev.choices && ev.choices[0];
            if (ch && ch.delta && ch.delta.content) feed(ch.delta.content);
            if (ch && ch.finish_reason) stopReason = ch.finish_reason;
            if (ev.error) throw new Error(ev.error.message || 'DeepSeek 流式响应出错');
          } else {
            if (ev.type === 'content_block_delta' && ev.delta && ev.delta.type === 'text_delta') feed(ev.delta.text);
            else if (ev.type === 'message_delta' && ev.delta && ev.delta.stop_reason) stopReason = ev.delta.stop_reason;
            else if (ev.type === 'error') throw new Error((ev.error && ev.error.message) || '流式响应出错');
          }
        }
      }
      out.textContent = text;
      if (stopReason === 'refusal' || stopReason === 'content_filter') {
        setStatus('此问触发了模型方的安全过滤,未能出断。换个问法再试。', true);
      } else if (!text) {
        throw new Error('未收到解读内容');
      } else {
        setStatus('断毕。已存入卦档。');
        attachAiReading(currentRecId, model, text);
      }
    } catch (e) {
      if (text) { out.textContent = text; }
      const hint = /Failed to fetch|NetworkError|TypeError/.test(String(e))
        ? '网络请求被拦截:托管版(Artifact)环境禁止外联,请在 PWA/本地版使用深断;或复制下方回报文本粘给东玄。'
        : String(e.message || e);
      setStatus('深断未成:' + hint, true);
      if (!text) out.classList.add('hidden');
    } finally {
      aiBusy = false;
      $('btn-deepread').disabled = false;
    }
  }

  // —— 事件 ——
  $('btn-deepread').addEventListener('click', deepRead);
  $('ai-provider').addEventListener('change', () => {
    localStorage.setItem(PKEY, $('ai-provider').value);
    syncProviderUI();
    setStatus('');
  });
  $('btn-togglekey').addEventListener('click', () => {
    $('keybox').classList.toggle('hidden');
    $('api-key').value = getKey();
  });
  $('btn-savekey').addEventListener('click', () => {
    const v = $('api-key').value.trim();
    if (v) { localStorage.setItem(curProvider().keyStore, v); $('keybox').classList.add('hidden'); setStatus(`${curProvider().label} Key 已存于本机浏览器。`); }
    else setStatus('Key 为空,未保存。', true);
  });
  $('btn-clearkey').addEventListener('click', () => {
    localStorage.removeItem(curProvider().keyStore); $('api-key').value = ''; setStatus(`${curProvider().label} Key 已清除。`);
  });
  $('ai-model').addEventListener('change', () => localStorage.setItem(curProvider().modelStore, $('ai-model').value));
  if (localStorage.getItem(PKEY) && PROVIDERS[localStorage.getItem(PKEY)]) $('ai-provider').value = localStorage.getItem(PKEY);
  syncProviderUI();

  $('btn-step').addEventListener('click', tossOnce);
  $('btn-auto').addEventListener('click', autoCast);
  $('btn-reset').addEventListener('click', () => resetBoard(true));
  $('btn-copy').addEventListener('click', async () => {
    const txt = $('report').value;
    try { await navigator.clipboard.writeText(txt); $('btn-copy').textContent = '已复制 ✓'; }
    catch (e) { $('report').select(); document.execCommand('copy'); $('btn-copy').textContent = '已复制 ✓'; }
    setTimeout(() => { $('btn-copy').textContent = '复制回报文本'; }, 1500);
  });
  $('histlist').addEventListener('click', e => {
    const del = e.target.closest('.btn-delrec');
    const cp = e.target.closest('.btn-copyrec');
    if (del) {
      const h = loadHistory(); h.splice(Number(del.dataset.i), 1);
      localStorage.setItem(HKEY, JSON.stringify(h)); renderHistory(); return;
    }
    if (cp) {
      const h = loadHistory(); const rec = h[Number(cp.dataset.i)];
      if (rec) navigator.clipboard.writeText(rec.report).catch(() => {});
      cp.textContent = '已复制 ✓'; setTimeout(() => { cp.textContent = '复制回报'; }, 1500);
      return;
    }
    const head = e.target.closest('.head');
    if (head) head.parentElement.classList.toggle('open');
  });
  $('btn-export').addEventListener('click', () => {
    const blob = new Blob([JSON.stringify(loadHistory(), null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'dongxuan-guadang.json';
    a.click();
    URL.revokeObjectURL(a.href);
  });
  $('btn-clearhist').addEventListener('click', () => {
    if (confirm('清空全部卦档?此操作不可恢复。')) { localStorage.removeItem(HKEY); renderHistory(); }
  });

  renderHistory();

  // —— PWA:离线缓存(仅 http/https 下注册,file:// 与受限环境自动跳过)——
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  }
})();
</script>
