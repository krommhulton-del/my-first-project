<style>

<div class="wrap">
  <header>
    <h1>东玄运势</h1>
    <p>按生辰排八字 · 看日运月运年运 <span class="seal">内测 v0.1</span></p>

      </div>
    </div>
    <div class="note">用阳历(公历)生日。不知道准确出生时间就填个大概，时辰只影响时柱与部分细断，日月年运主要看日柱。</div>
    <div class="formerr" id="in-err"></div>
    <div class="btnrow"><button id="btn-go" class="primary">排盘看运</button></div>
  </section>

  <section id="sec-ming" class="hidden">
    <h2>你 的 命 盘</h2>
    <div class="pillars" id="pillars"></div>
    <div class="body-line" id="body-line"></div>
    <div class="body-sub" id="body-sub"></div>

    </div>
    <div id="ai-status"></div>
    <div id="ai-out" class="aiout hidden"></div>

  <footer>东玄运势 v0.1 内测 · 八字流年扶抑法 · 历法自实现(朔望/节气) · 排盘不联网</footer>
</div>

<script>
// najia.js — 京房纳甲排盘:八宫世应、纳甲干支、六亲、六神、干支历、旬空
// 依《火珠林》《卜筮正宗》通行体例。爻序自下而上,索引 0 = 初爻。
// 历法约定:日柱零点换日;月建、年柱以节气(太阳黄经,立春315°起寅月)为界。
(function (root, factory) {
  if (typeof module === 'object' && module.exports) { module.exports = factory(); }
  else { root.Najia = factory(); }
}(typeof self !== 'undefined' ? self : this, function () {
  const GAN = ['甲', '乙', '丙', '丁', '戊', '己', '庚', '辛', '壬', '癸'];
  const ZHI = ['子', '丑', '寅', '卯', '辰', '巳', '午', '未', '申', '酉', '戌', '亥'];
  const ZHI_WX = { 子: '水', 丑: '土', 寅: '木', 卯: '木', 辰: '土', 巳: '火', 午: '火', 未: '土', 申: '金', 酉: '金', 戌: '土', 亥: '水' };
  const TRIGRAM_NAME = { '111': '乾', '110': '兑', '101': '离', '100': '震', '011': '巽', '010': '坎', '001': '艮', '000': '坤' };
  const PALACE_WX = { 乾: '金', 兑: '金', 离: '火', 震: '木', 巽: '木', 坎: '水', 艮: '土', 坤: '土' };
  // 纳甲表:各经卦内/外卦所纳天干与三支(自下而上)
  const NAJIA_TABLE = {
    乾: { gan: ['甲', '壬'], inner: ['子', '寅', '辰'], outer: ['午', '申', '戌'] },
    坤: { gan: ['乙', '癸'], inner: ['未', '巳', '卯'], outer: ['丑', '亥', '酉'] },
    震: { gan: ['庚', '庚'], inner: ['子', '寅', '辰'], outer: ['午', '申', '戌'] },
    巽: { gan: ['辛', '辛'], inner: ['丑', '亥', '酉'], outer: ['未', '巳', '卯'] },
    坎: { gan: ['戊', '戊'], inner: ['寅', '辰', '午'], outer: ['申', '戌', '子'] },
    离: { gan: ['己', '己'], inner: ['卯', '丑', '亥'], outer: ['酉', '未', '巳'] },
    艮: { gan: ['丙', '丙'], inner: ['辰', '午', '申'], outer: ['戌', '子', '寅'] },
    兑: { gan: ['丁', '丁'], inner: ['巳', '卯', '丑'], outer: ['亥', '酉', '未'] },
  };
  // 五行生克
  const SHENG = { 木: '火', 火: '土', 土: '金', 金: '水', 水: '木' }; // A 生 SHENG[A]
  const KE = { 木: '土', 土: '水', 水: '火', 火: '金', 金: '木' };    // A 克 KE[A]

  function liuQin(palaceWx, yaoWx) {
    if (palaceWx === yaoWx) return '兄弟';
    if (SHENG[yaoWx] === palaceWx) return '父母'; // 生我者
    if (SHENG[palaceWx] === yaoWx) return '子孙'; // 我生者
    if (KE[yaoWx] === palaceWx) return '官鬼';    // 克我者
    return '妻财';                                 // 我克者
  }

  // ——— 八宫世应:由八纯卦程序化生成全部 64 卦归宫 ———
  // 序:本宫(世6)→一世~五世(依次变初至五爻)→游魂(五世再变四爻)→归魂(游魂内卦复原)
  const PALACE_MAP = (function () {
    const map = {};
    const SHI = [6, 1, 2, 3, 4, 5, 4, 3];
    const GEN = ['本宫卦', '一世卦', '二世卦', '三世卦', '四世卦', '五世卦', '游魂卦', '归魂卦'];
    for (const bits of Object.keys(TRIGRAM_NAME)) {
      const palace = TRIGRAM_NAME[bits];
      let lines = (bits + bits).split('').map(Number);
      const put = (gen) => {
        const id = lines.join('');
        map[id] = { palace, palaceWx: PALACE_WX[palace], gen: GEN[gen], shi: SHI[gen], ying: ((SHI[gen] - 1 + 3) % 6) + 1 };
      };
      put(0);
      for (let i = 0; i < 5; i++) { lines[i] ^= 1; put(i + 1); }   // 一世~五世
      lines[3] ^= 1; put(6);                                       // 游魂
      for (let i = 0; i < 3; i++) lines[i] = Number(bits[i]);      // 归魂:内卦复原
      put(7);
    }
    return map;
  })();

  // ——— 干支历 ———
  // 日柱锚点:2000-01-07 为甲子日(零点换日,取本地日期)
  function dayIndex(y, m, d) {
    const days = Math.round((Date.UTC(y, m - 1, d) - Date.UTC(2000, 0, 7)) / 86400000);
    return ((days % 60) + 60) % 60;
  }
  const gz = i => GAN[i % 10] + ZHI[i % 12];

  // 太阳视黄经(Meeus 低精度,误差约 0.01°,足定节气)
  function sunLongitude(dateUtcMs) {
    const jd = dateUtcMs / 86400000 + 2440587.5;
    const T = (jd - 2451545.0) / 36525;
    const rad = Math.PI / 180;
    const L0 = 280.46646 + 36000.76983 * T + 0.0003032 * T * T;
    const M = (357.52911 + 35999.05029 * T - 0.0001537 * T * T) * rad;
    const C = (1.914602 - 0.004817 * T - 0.000014 * T * T) * Math.sin(M)
      + (0.019993 - 0.000101 * T) * Math.sin(2 * M) + 0.000289 * Math.sin(3 * M);
    const omega = (125.04 - 1934.136 * T) * rad;
    let lam = L0 + C - 0.00569 - 0.00478 * Math.sin(omega);
    lam %= 360; if (lam < 0) lam += 360;
    return lam;
  }

  // 完整干支(年柱、月建、日辰、旬空)。date 为 Date,按其本地历日与时刻计算。
  function ganZhi(date) {
    const y = date.getFullYear(), m = date.getMonth() + 1, d = date.getDate();
    const lam = sunLongitude(date.getTime());
    const mi = Math.floor((((lam - 315) % 360) + 360) % 360 / 30); // 0=寅月 … 11=丑月
    const lunarYear = (m <= 2 && mi >= 10) ? y - 1 : y;            // 立春前属旧岁
    const yGan = ((lunarYear - 4) % 10 + 10) % 10, yZhi = ((lunarYear - 4) % 12 + 12) % 12;
    const mZhi = (mi + 2) % 12;                                    // 寅=ZHI[2]
    const mGan = ((yGan % 5) * 2 + 2 + mi) % 10;                   // 五虎遁
    const dIdx = dayIndex(y, m, d);
    const xunShou = dIdx - (dIdx % 10);
    const kong = [ZHI[(xunShou + 10) % 12], ZHI[(xunShou + 11) % 12]];
    return {
      year: GAN[yGan] + ZHI[yZhi], month: GAN[mGan] + ZHI[mZhi], day: gz(dIdx),
      monthZhi: ZHI[mZhi], dayGan: GAN[dIdx % 10], dayZhi: ZHI[dIdx % 12],
      xunKong: kong, sunLon: lam,
    };
  }

  // 六神:依日干起,自初爻而上
  const LIU_SHEN = ['青龙', '朱雀', '勾陈', '螣蛇', '白虎', '玄武'];
  function liuShen(dayGan) {
    const start = { 甲: 0, 乙: 0, 丙: 1, 丁: 1, 戊: 2, 己: 3, 庚: 4, 辛: 4, 壬: 5, 癸: 5 }[dayGan];
    return Array.from({ length: 6 }, (_, i) => LIU_SHEN[(start + i) % 6]);
  }

  // ——— 装卦:对某卦 id(六位 bits,自下而上)排纳甲 ———
  function zhuangGua(id, date) {
    const info = PALACE_MAP[id];
    if (!info) throw new Error('未知卦 id:' + id);
    const lower = TRIGRAM_NAME[id.slice(0, 3)], upper = TRIGRAM_NAME[id.slice(3, 6)];
    const cal = date ? ganZhi(date) : null;
    const shen = cal ? liuShen(cal.dayGan) : null;
    const lines = [];
    for (let i = 0; i < 6; i++) {
      const tri = i < 3 ? lower : upper;
      const t = NAJIA_TABLE[tri];
      const gan = i < 3 ? t.gan[0] : t.gan[1];
      const zhi = i < 3 ? t.inner[i] : t.outer[i - 3];
      const wx = ZHI_WX[zhi];
      lines.push({
        pos: i + 1, ganZhi: gan + zhi, zhi, wx,
        liuQin: liuQin(info.palaceWx, wx),
        shi: info.shi === i + 1, ying: info.ying === i + 1,
        liuShen: shen ? shen[i] : null,
        kong: cal ? cal.xunKong.includes(zhi) : false,
      });
    }
    return { palace: info.palace, palaceWx: info.palaceWx, gen: info.gen, shi: info.shi, ying: info.ying, lines, cal };
  }

  return { ganZhi, zhuangGua, liuShen, dayIndex, sunLongitude, PALACE_MAP, GAN, ZHI, ZHI_WX };
}));

</script>
<script>
// lunar.js — 农历(夏历)自实现:朔日定月、冬至建子、无中气置闰
// 天文基础:Meeus 低精度朔望与太阳黄经;历日按东八区(中国标准时)零点为界。
(function (root, factory) {
  if (typeof module === 'object' && module.exports) { module.exports = factory(require('./najia.js')); }
  else { root.Lunar = factory(root.Najia); }
}(typeof self !== 'undefined' ? self : this, function (Najia) {
  const rad = Math.PI / 180;
  const DAY = 86400000;
  const TZ = 8 * 3600000; // 东八区

  // ——— 朔(新月)时刻,Meeus 第 49 章主要项,精度约 1 分钟 ———
  function newMoonJDE(k) {
    const T = k / 1236.85;

      + 0.00015437 * T * T - 0.000000150 * T * T * T + 0.00000000073 * T * T * T * T;

    const M = (2.5534 + 29.10535670 * k - 0.0000014 * T * T - 0.00000011 * T * T * T) * rad;
    const Mp = (201.5643 + 385.81693528 * k + 0.0107582 * T * T + 0.00001238 * T * T * T - 0.000000058 * T * T * T * T) * rad;
    const F = (160.7108 + 390.67050284 * k - 0.0016118 * T * T - 0.00000227 * T * T * T + 0.000000011 * T * T * T * T) * rad;
    const Om = (124.7746 - 1.56375588 * k + 0.0020672 * T * T + 0.00000215 * T * T * T) * rad;
    jde += -0.40720 * Math.sin(Mp)
      + 0.17241 * E * Math.sin(M)
      + 0.01608 * Math.sin(2 * Mp)
      + 0.01039 * Math.sin(2 * F)
      + 0.00739 * E * Math.sin(Mp - M)
      - 0.00514 * E * Math.sin(Mp + M)
      + 0.00208 * E * E * Math.sin(2 * M)

    c.dayun = du ? `${du.gz}大运(${du.fromAge}岁起)` : null;
    return c;
  }
  // 流月:节气月建
  function yueYun(chart, targetDate) {
    const cal = Najia.ganZhi(targetDate);
    return judgeCard(chart, cal.month[0], cal.month[1], '月运', `${cal.month}月`);
  }
  // 流日
  function riYun(chart, targetDate) {
    const cal = Najia.ganZhi(targetDate);
    const two = n => String(n).padStart(2, '0');
    const span = `${targetDate.getFullYear()}-${two(targetDate.getMonth() + 1)}-${two(targetDate.getDate())}(${cal.day}日)`;
    return judgeCard(chart, cal.day[0], cal.day[1], '日运', span);
  }

  function all(chart, targetDate) {
    return { year: nianYun(chart, targetDate), month: yueYun(chart, targetDate), day: riYun(chart, targetDate) };
  }

  return { all, nianYun, yueYun, riYun, scoreGZ, DOMAIN };
}));

</script>
<script>
(function () {
  const $ = id => document.getElementById(id);
  const WX_CLS = { 木: 'mu', 火: 'huo', 土: 'tu', 金: 'jin', 水: 'shui' };
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  let curChart = null, aiBusy = false, aiContext = null;

  function wxSpan(ch, wx) { return `<span class="${WX_CLS[wx] || ''}">${ch}</span>`; }

  function go() {
    $('in-err').textContent = '';
    const d = $('bdate').value, tm = $('btime').value || '12:00';
    if (!d) { $('in-err').textContent = '请先填出生日期。'; return; }
    const [Y, M, D] = d.split('-').map(Number);
    const [h, mi] = tm.split(':').map(Number);
    const birth = new Date(Y, M - 1, D, h, mi || 0);
    if (isNaN(birth.getTime()) || Y < 1900 || Y > 2100) { $('in-err').textContent = '日期看起来不对,检查一下。'; return; }
    curChart = Bazi.chart(birth, $('gender').value);
    renderMing(curChart);
    renderYun(curChart, new Date());
    renderDayun(curChart);
    $('qdate').value = todayStr();
    ['sec-ming', 'sec-yun', 'sec-dayun', 'sec-ai'].forEach(s => $(s).classList.remove('hidden'));
    $('ai-out').classList.add('hidden'); $('ai-out').textContent = ''; $('ai-status').textContent = '';
    $('sec-ming').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
  function todayStr() { const d = new Date(), z = n => String(n).padStart(2, '0'); return `${d.getFullYear()}-${z(d.getMonth() + 1)}-${z(d.getDate())}`; }

  function renderMing(c) {
    const P = c.pillars, cap = { year: '年柱', month: '月柱', day: '日柱', hour: '时柱' };
    $('pillars').innerHTML = ['year', 'month', 'day', 'hour'].map(k => {
      const p = P[k];
      return `<div class="pcol"><div class="cap">${cap[k]}</div>
        <div class="gz">${wxSpan(p.gan, p.ganWx)}${wxSpan(p.zhi, p.zhiWx)}</div>
        <div class="ss">${k === 'day' ? '日主' : esc(p.ganShen)}</div></div>`;
    }).join('');
    const s = c.strength;
    const qiang = s.strong ? '偏强' : '偏弱';
    const yongTalk = s.strong
      ? `你这人底子<b>${qiang}</b>,自己有劲、有主见。对你添彩的是能"用掉、花掉、管住你"那股劲的五行——也就是${xiPlain(c)};最怕再有人一个劲儿给你加码。`
      : `你这人底子<b>${qiang}</b>,劲儿容易不够使。对你添力的是"生你、帮你"的五行——也就是${xiPlain(c)};最怕再被消耗、被压。`;
    $('body-line').innerHTML = `你是<b>${c.dayGan}${c.dayWx}命</b>(日主${c.dayWx}),身${qiang}。`;
    $('body-sub').innerHTML = `${yongTalk}<br><span style="opacity:.8">命盘:${esc(c.lunarText)} · 生扶力 ${s.help} / 耗泄力 ${s.drain}(${s.pct}%)· 日主${esc(s.deLing)}</span>`;
  }
  function xiPlain(c) {
    const names = { 木: '木(青绿、东方、春木、生发)', 火: '火(红、南方、热闹、表达)', 土: '土(黄、稳、地产、诚信)', 金: '金(白、西方、金属、决断)', 水: '水(黑蓝、北方、流动、智慧)' };
    return c.yong.xiWx.map(w => names[w]).join('、');
  }

  function renderYun(c, target) {
    const y = Yunshi.all(c, target);
    aiContext = { c, target, y };
    $('yun-cards').innerHTML = ['day', 'month', 'year'].map(k => card(y[k])).join('');
  }
  function card(cd) {
    const good = cd.score >= 0;
    const cls = cd.score >= 1 ? 'good' : (cd.score <= -1 ? 'bad' : '');
    const lvcls = good ? 'g' : '';
    return `<div class="yscard ${cls}">
      <div class="yh"><span class="ylabel">${esc(cd.label)}</span>
        <span class="ylv ${lvcls}">${esc(cd.level)}</span>
        <span class="yarea">${esc(cd.area)}</span></div>
      <div class="ytext">${esc(cd.text)}</div>
      <div class="ymeta">${esc(cd.span)} · 天干${esc(cd.shen)}(${esc(cd.cls)})${cd.dayun ? ' · 正走 ' + esc(cd.dayun) : ''}</div>
    </div>`;
  }
  function qday() {
    if (!curChart) return;
    const d = $('qdate').value; if (!d) return;
    const [Y, M, D] = d.split('-').map(Number);
    const target = new Date(Y, M - 1, D, 12, 0);
    renderYun(curChart, target);
  }

  function renderDayun(c) {
    const du = c.dayun;
    $('dayun-dir').innerHTML = `排法:${du.forward ? '顺行' : '逆行'} · 约 <b style="color:var(--cinnabar)">${du.startAge}</b> 岁起运,每步管十年。`;
    const nowAge = new Date().getFullYear() - c.birth.getFullYear();
    $('dayun-head').innerHTML = '<th>起始</th>' + du.list.map(d => `<th>${d.fromAge}岁</th>`).join('');
    $('dayun-body').innerHTML = '<td style="color:var(--dim)">大运</td>' + du.list.map(d => {
      const now = nowAge >= d.fromAge && nowAge < d.fromAge + 10;
      return `<td class="${now ? 'now' : ''}">${wxSpanGZ(d.gz)}</td>`;
    }).join('');
  }
  function wxSpanGZ(gz) { return wxSpan(gz[0], Bazi.GAN_WX[gz[0]]) + wxSpan(gz[1], Bazi.ZHI_WX[gz[1]]); }

  // —— AI 深批 ——
  const SYS = `你是一位精通子平八字的命理师,道号「东玄」。依旺衰扶抑法看运势(得令得地得生得助定身强弱,身强喜耗泄、身弱喜生扶,流年为喜用则顺、忌神则不利,流年天干十神定所主之事)。
【风格铁律——最重要】
1. 全程大白话、接地气,像街坊里那个看得准的老先生当面跟人唠。真有本事的人能把玄的东西讲得外行秒懂;越是掉书袋、堆术语、拽文言文,越是没底气、存心让人听不懂。"日主""用神""十神""喜忌""生克"这些是你心里的算盘珠子,不许原样撂到客人面前——非得提就立刻翻成人话(别说"今年官杀为忌",要说"今年工作上压得慌、容易被管被挑刺")。
2. 好就说好、差就说差,不打太极、不免责、不灌鸡汤。凶的年月照实说,但只就事论事,不借着凶运引申教育人、不上价值观。
3. 具体落地:问财给该守该攻、大概进项方向;问工作给升降和压力来处;问感情给冷热聚散;都落到具体月份或时间段。禁止"因人而异""仅供参考""还得看个人"。
4. 只断事不审人:命主的追求、标准照单全收,不评判、不替他/她预设没说过的立场,不贴标签。问啥答啥,不脑补人生观。
5. 不用 markdown 标题符号,不用编号清单,像当面说话不是写报告。命盘与流年干支由程序算好且真实,直接据此断。
【领域对照(心里用,落纸翻白话)】财星=钱与感情(男命兼女人缘);官杀=工作压力升迁与约束(女命兼正缘);印星=贵人文书房子长辈学习;比劫=朋友合伙竞争破财;食伤=才华表达投资副业子女跳槽。`;

  function buildMaterial() {
    const { c, target, y } = aiContext;
    const P = c.pillars;
    const four = ['year', 'month', 'day', 'hour'].map(k => `${k}=${P[k].gz}(${P[k].ganShen})`).join(' ');
    const du = y.year.dayun || '未定';
    return `【命主】${c.gender},生于 ${c.lunarText}。
四柱:${four}。日主${c.dayGan}${c.dayWx},身${c.strength.strong ? '强' : '弱'}(生扶${c.strength.help}/耗泄${c.strength.drain})。
喜用五行:${c.yong.xiWx.join('、')};忌神五行:${c.yong.jiWx.join('、')}。
正走大运:${du}。
【所看时段】
今年(${y.year.span}):干支${y.year.gz},程序判为「${y.year.level}」,天干十神${y.year.shen}。
本月(${y.month.span}):干支${y.month.gz},判「${y.month.level}」,${y.month.shen}。
今日(${y.day.span}):干支${y.day.gz},判「${y.day.level}」,${y.day.shen}。
【今天是什么日子——所有"今年/本月/今日"以此为准】阳历 ${nowText()}。${y.year.span}就是今年,${y.month.span}就是本月,${y.day.span}就是今天。给时间点落在合理范围,问本月别飘到别的月去。
【落笔硬要求】读者是外行只想听人话:回答里不许出现"日主/用神/十神/喜忌/生克/旺衰/天干地支干支/正财偏财官杀印比食伤"这些字眼,全翻成大白话(比如别说"今年官杀为忌",要说"今年工作上压得慌、容易被管被挑刺")。每段先甩人话结论再说为啥,不用编号清单和markdown,像老先生当面唠。
请分「今年 / 本月 / 今日」三段,各用大白话细说这个人的运势:钱财、工作、感情、健康、贵人各挑要紧的说,该攻该守都点明,给具体月份或时间段。开头一句先给这一年的总基调。`;
  }
  function nowText() {
    const d = new Date(), wd = '日一二三四五六'[d.getDay()];
    return `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日 星期${wd}`;
  }

  const PROVIDERS = {
    claude: { keyStore: 'dongxuan_api_key', modelStore: 'dongxuan_ai_model',
      models: [['claude-fable-5', 'Claude Fable 5(顶配)'], ['claude-opus-4-8', 'Claude Opus 4.8']],
      keyLabel: 'Anthropic API Key(仅存本机浏览器,直连官方接口)', ph: 'sk-ant-api03-…',
      note: '在 platform.claude.com 创建 API Key。命盘与流年会发给模型按东玄风格细批,按 token 计费。' },
    deepseek: { keyStore: 'dongxuan_ds_key', modelStore: 'dongxuan_ds_model',
      models: [['deepseek-reasoner', 'DeepSeek R1 深度推理'], ['deepseek-chat', 'DeepSeek V3']],
      keyLabel: 'DeepSeek API Key(仅存本机浏览器,直连 api.deepseek.com)', ph: 'sk-…',
      note: '在 platform.deepseek.com 创建 API Key。按 token 计费。' },
  };
  const label = { claude: 'Claude', deepseek: 'DeepSeek' };
  function prov() { return PROVIDERS[$('ai-provider').value]; }
  function getKey() { return localStorage.getItem(prov().keyStore) || ''; }
  function syncProv() {
    const p = prov();
    $('ai-model').innerHTML = p.models.map(m => `<option value="${m[0]}">${m[1]}</option>`).join('');
    const sm = localStorage.getItem(p.modelStore); if (sm && p.models.some(m => m[0] === sm)) $('ai-model').value = sm;
    $('key-label').textContent = p.keyLabel; $('api-key').placeholder = p.ph; $('key-note').textContent = p.note; $('api-key').value = getKey();
  }
  function setStatus(m, e) { $('ai-status').textContent = m; $('ai-status').classList.toggle('err', !!e); }

  async function deepRead() {
    if (aiBusy || !aiContext) { if (!aiContext) setStatus('先排盘。', true); return; }
    const key = getKey(), pid = $('ai-provider').value;
    if (!key) { setStatus(`请先设置 ${label[pid]} API Key。`, true); $('keybox').classList.remove('hidden'); return; }
    const model = $('ai-model').value, material = buildMaterial();
    let url, headers, body;
    if (pid === 'deepseek') {
      url = 'https://api.deepseek.com/chat/completions';
      headers = { 'content-type': 'application/json', authorization: 'Bearer ' + key };
      body = { model, stream: true, max_tokens: 8000, messages: [{ role: 'system', content: SYS }, { role: 'user', content: material }] };
    } else {
      url = 'https://api.anthropic.com/v1/messages';
      headers = { 'content-type': 'application/json', 'x-api-key': key, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' };
      body = { model, max_tokens: 16000, stream: true, system: SYS, messages: [{ role: 'user', content: material }] };
      if (model === 'claude-fable-5') { headers['anthropic-beta'] = 'server-side-fallback-2026-06-01'; body.fallbacks = [{ model: 'claude-opus-4-8' }]; }
      else body.thinking = { type: 'adaptive' };
    }
    aiBusy = true; $('btn-ai').disabled = true; setStatus('东玄凝神看盘……');
    const out = $('ai-out'); out.classList.remove('hidden'); out.innerHTML = '<span class="cursor">▍</span>';
    let text = '', stop = null;
    try {
      const resp = await fetch(url, { method: 'POST', headers, body: JSON.stringify(body) });
      if (!resp.ok) { let m = 'HTTP ' + resp.status; try { const j = await resp.json(); m = (j.error && (j.error.message || j.error)) || m; } catch (e) {} if (resp.status === 401) m = 'API Key 无效,请重设。'; if (resp.status === 402) m = 'DeepSeek 余额不足。'; throw new Error(m); }
      const rd = resp.body.getReader(), dec = new TextDecoder(); let buf = '';
      const feed = t => { text += t; out.textContent = text; out.insertAdjacentHTML('beforeend', '<span class="cursor">▍</span>'); };
      while (true) {
        const { done, value } = await rd.read(); if (done) break;
        buf += dec.decode(value, { stream: true }); const parts = buf.split('\n\n'); buf = parts.pop();
        for (const part of parts) {
          const dl = part.split('\n').find(l => l.startsWith('data:')); if (!dl) continue;
          const pl = dl.replace(/^data:\s*/, ''); if (pl === '[DONE]') continue;
          let ev; try { ev = JSON.parse(pl); } catch (e) { continue; }
          if (pid === 'deepseek') { const ch = ev.choices && ev.choices[0]; if (ch && ch.delta && ch.delta.content) feed(ch.delta.content); if (ch && ch.finish_reason) stop = ch.finish_reason; if (ev.error) throw new Error(ev.error.message || 'DeepSeek 出错'); }
          else { if (ev.type === 'content_block_delta' && ev.delta && ev.delta.type === 'text_delta') feed(ev.delta.text); else if (ev.type === 'message_delta' && ev.delta && ev.delta.stop_reason) stop = ev.delta.stop_reason; else if (ev.type === 'error') throw new Error((ev.error && ev.error.message) || '出错'); }
        }
      }
      out.textContent = text;
      if (stop === 'refusal' || stop === 'content_filter') setStatus('此问触发了模型安全过滤,换个问法再试。', true);
      else if (!text) throw new Error('未收到内容'); else setStatus('批毕。');
    } catch (e) {
      if (text) out.textContent = text;
      const hint = /Failed to fetch|NetworkError|TypeError/.test(String(e))
        ? '网络被拦截:托管版禁止外联,请在桌面/本地版用深批。' : String(e.message || e);
      setStatus('深批未成:' + hint, true); if (!text) out.classList.add('hidden');
    } finally { aiBusy = false; $('btn-ai').disabled = false; }
  }

  // 事件
  $('btn-go').addEventListener('click', go);
  $('btn-qday').addEventListener('click', qday);
  $('btn-ai').addEventListener('click', deepRead);
  $('ai-provider').addEventListener('change', () => { localStorage.setItem('dongxuan_ai_provider', $('ai-provider').value); syncProv(); setStatus(''); });
  $('btn-togglekey').addEventListener('click', () => { $('keybox').classList.toggle('hidden'); $('api-key').value = getKey(); });
  $('btn-savekey').addEventListener('click', () => { const v = $('api-key').value.trim(); if (v) { localStorage.setItem(prov().keyStore, v); $('keybox').classList.add('hidden'); setStatus('Key 已存本机。'); } else setStatus('Key 为空。', true); });
  $('btn-clearkey').addEventListener('click', () => { localStorage.removeItem(prov().keyStore); $('api-key').value = ''; setStatus('Key 已清除。'); });
  $('ai-model').addEventListener('change', () => localStorage.setItem(prov().modelStore, $('ai-model').value));
  if (localStorage.getItem('dongxuan_ai_provider') && PROVIDERS[localStorage.getItem('dongxuan_ai_provider')]) $('ai-provider').value = localStorage.getItem('dongxuan_ai_provider');
  syncProv();

})();
</script>
